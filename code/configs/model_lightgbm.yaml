run_name: lightgbm_v1
input_filename: features.parquet
target: value

model:
  name: lightgbm
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    verbose: -1

split:
  test_start: "2025-01-01"

backtest:
  n_splits: 5
  test_size: 336
  gap: 48

# Keep every lag >= the forecast gap, or the model sees the future.
features:
  - tod_sin
  - tod_cos
  - dow_sin
  - dow_cos
  - doy_sin
  - doy_cos
  - is_weekend
  - is_holiday
  - heating_degrees
  - cooling_degrees
  - value_lag_48
  - value_lag_96
  - value_lag_336
  - value_roll_mean_336
  - value_roll_std_336
