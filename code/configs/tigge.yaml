# ECMWF IFS ENS historical forecasts from the TIGGE archive, via the ECMWF
# Data Store (ECDS, https://ecds.ecmwf.int - same software and client as the
# Copernicus CDS). Needs ECDS_API_URL / ECDS_API_KEY in .env and the TIGGE
# licence accepted on the ECDS dataset page. Research use, 48 h delay.
#
# The old Public Datasets Web API (apps.ecmwf.int) was decommissioned on
# 2026-05-27; TIGGE lives only here now.
#
# This is the true historical FORECAST ensemble: 50 perturbed members + control,
# every run since 2006, 0.5 deg, 6-hourly. It is what a day-ahead model would
# actually have seen, unlike ERA5 (what happened) - see ADR 0003.

dataset: tigge-forecasts
origin: ecmwf
level_type: single_level

start: "2022-12"
end: "2026-05"

# Runs and lead times. 00z+12z with 0-48 h covers day-ahead and two-day-ahead
# issuance; the first two perturbed months were pulled at 0-72 h / 14 variables.
times: ["00:00", "12:00"]
leadtime_hours: [0, 6, 12, 18, 24, 30, 36, 42, 48]

# One request per type-month. control_forecast = member 0, perturbed_forecast
# = members 1-50. ECDS publishes no member selector; 'members' is forwarded
# as a MARS 'number' key on a best-effort basis - check the extract's member
# count to see whether it was honoured.
forecast_types: [control_forecast, perturbed_forecast]
members: "1/to/10"

# ECDS variable names for the single-level TIGGE set.
variables:                       # minimum viable set for a demand model
  - 2_m_temperature
  - 2_m_dewpoint_temperature
  - 10_m_u_component_of_wind
  - 10_m_v_component_of_wind
  - total_cloud_cover
  - total_precipitation          # accumulated from run start
  - snow_fall_water_equivalent   # accumulated from run start
  - surface_net_solar_radiation  # accumulated from run start

# [North, West, South, East] - same box as ERA5 and AIFS.
area: [55.0, -5.0, 50.0, 2.0]

# ECDS serves GRIB only.
data_format: grib

# Concurrent data-store jobs; the queue throttles per user.
max_workers: 2

# Under code/data/external/
output_subdir: weather/tigge_ens

# GRIBs are deleted after site extraction (list types here to keep theirs); perturbed
# months are ~1 GB each and only the site extract is needed downstream.
keep_grib_for: []
