name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check code/
          ruff format --check code/

      - name: Test
        run: pytest --cov=sense_energy --cov-report=term-missing

  no-data-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if data files were committed
        run: |
          if git ls-files 'code/data/**' | grep -vE '(\.gitkeep|README\.md)$' | grep .; then
            echo "::error::Data files must never be committed. See doc/data_governance.md"
            exit 1
          fi
          echo "No data files tracked."
